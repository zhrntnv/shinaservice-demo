<style>
:root{--bg:#14161a;--bg2:#1d2025;--steel:#e9ebee;--mut:#9aa1ab;--line:#31353c;--y:#ffc400;--y2:#e0ab00;color-scheme:dark;
--fd:'Unbounded','Arial Black',sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));height:100%}
html,body{max-width:100%;overflow-x:clip}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--steel);font:400 17px/1.55 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--y);outline-offset:3px;border-radius:4px}
.wrap{width:min(1480px,100% - 48px);margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,22,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;min-height:66px}
.logo{margin-right:auto;font:800 14px/1.15 var(--fd);text-decoration:none;min-width:0}
.logo small{display:block;font:500 11px var(--fb);color:var(--mut);margin-top:3px}
nav{display:flex;gap:26px}
nav a{text-decoration:none;opacity:.85;font-weight:500}nav a:hover{opacity:1;color:var(--y)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{font:600 13px var(--fb);background:none;border:0;color:var(--mut);padding:6px 12px;border-radius:99px;cursor:pointer;min-height:32px}
.lang button[aria-pressed=true]{background:var(--steel);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 28px;border-radius:12px;background:var(--y);color:#14161a;font:700 16px var(--fb);text-decoration:none;border:2px solid var(--y);cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:var(--y2);border-color:var(--y2)}.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--steel);border-color:var(--steel)}.btn.ghost:hover{background:var(--steel);color:var(--bg)}
.btn.sm{min-height:42px;padding:0 18px;font-size:15px}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--steel);width:44px;height:44px;border-radius:12px;cursor:pointer;flex:none}
.burger svg{display:block;margin:auto}
.hero{padding:clamp(40px,8vw,110px) 0;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.hero .wrap>*{min-width:0}
h1{font:800 min(5.2vw,76px)/1 var(--fd);letter-spacing:-.03em;margin:0 0 24px;overflow-wrap:normal;hyphens:none}
h1 em{font-style:normal;color:var(--y)}
.hero p{font-size:clamp(17px,2vw,21px);color:#cfd3d9;max-width:30em;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.heroimg{margin:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:var(--bg2)}.heroimg img{width:100%;height:100%;object-fit:cover;display:block}
.gal{margin-top:28px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.gal figure{margin:0;border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:var(--bg2)}.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.gal figure:hover img{transform:scale(1.04)}
.revs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:28px}@media(max-width:700px){.revs{grid-template-columns:1fr}}
.rev{position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;transition:border-color .2s,transform .2s}
.rev:hover{border-color:var(--y);transform:translateY(-3px)}
.rev::after{content:"”";position:absolute;right:16px;bottom:-18px;font:800 96px/1 var(--fd);color:var(--y);opacity:.14;pointer-events:none}
.rh{display:flex;align-items:center;gap:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--y);color:#14161a;display:grid;place-items:center;font:700 17px var(--fb)}
.av svg{display:block}
.rev b{display:block;font-size:16px;line-height:1.2}
.rev .st{color:var(--y);letter-spacing:2px;font-size:15px;line-height:1.3}
.rev .src{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;align-self:flex-start}
.rev p{margin:0;color:#dfe2e6;font-size:16px;line-height:1.6;position:relative}
section{padding:clamp(56px,8vw,100px) 0}
h2{font:800 clamp(26px,4.4vw,52px)/1.05 var(--fd);letter-spacing:-.025em;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 32px;max-width:36em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.two>*{min-width:0}
.alt{background:var(--bg2);border-block:1px solid var(--line)}
form{display:grid;gap:18px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px)}
.alt form{background:var(--bg)}
label{display:grid;gap:8px;font-weight:600;font-size:15px}
input,textarea{font:400 17px var(--fb);color:var(--steel);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:0 16px;min-height:52px;width:100%}
textarea{padding:14px 16px;min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--y);outline-offset:1px;border-color:var(--y)}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14px;color:var(--mut)}
.chk input{width:22px;min-height:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--y)}
.note{display:inline-block;font:700 13px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--y);margin-bottom:12px}
#status{margin:0;font-size:15px;min-height:1.4em}
#status.ok{color:#7ddc8a}#status.err{color:#ff9b8a}
.info{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:14px}
.info li{padding-bottom:14px;border-bottom:1px solid var(--line)}
.info b{display:block;font-size:13px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.mapbox{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.mapcard{height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px;padding:clamp(24px,5vw,48px)}
.mapcard p{margin:0;max-width:26em;color:#cfd3d9}
footer{padding:36px 0 44px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:center}
@media(max-width:900px){
 nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:8px 20px 16px;display:none}
 nav.open{display:flex}nav a{padding:14px 0;font-size:18px;border-bottom:1px solid var(--line)}
 .burger{display:block}.hero .wrap,.two{grid-template-columns:1fr}
 h1{font-size:min(8.6vw,64px)}.heroimg{order:-1;aspect-ratio:4/3}.heroimg img{object-position:50% 36%}
}
@media(max-width:560px){.bar{gap:8px}.logo{flex:1 1 0;font-size:12.5px}.logo small{display:none}.lang button{padding:6px 9px}.hdr-call{display:none}.cta .btn{flex:1 1 100%}.gal{gap:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.spin{animation:none!important}}
.spin{transform-origin:200px 200px;animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:1200px){.gal figure{aspect-ratio:4/3}}
@media(min-width:1500px){.revs{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1800px){.wrap{width:min(1760px,100% - 160px)}body{font-size:20px}h1{font-size:min(5.2vw,124px)}h2{font-size:clamp(26px,3.4vw,68px)}.btn{min-height:56px;font-size:18px;padding:0 32px}.btn.sm{min-height:48px;font-size:16px;padding:0 22px}.logo{font-size:17px}.hero p{font-size:24px}.rev p{font-size:18px}.hero{padding:clamp(64px,7vw,140px) 0}}
</style>
</head>

let lang="uk";try{const s=localStorage.getItem("lang");if(s==="ru"||s==="uk")lang=s}catch(e){}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
 $$('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(v!=null)e.hasAttribute('data-html')?e.innerHTML=v:e.textContent=v});
 $$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 $$('[data-map]').forEach(a=>a.href=MAPS);$$('[data-dir]').forEach(a=>a.href=DIR);
 const L=[];
 if(INFO.phone)L.push(`<li><b>${t.phone}</b><a href="tel:${esc(tel(INFO.phone))}">${esc(INFO.phone)}</a></li>`);
 if(INFO.address[lang])L.push(`<li><b>${t.address}</b>${esc(INFO.address[lang])}</li>`);
 if(INFO.hours[lang])L.push(`<li><b>${t.hours}</b>${esc(INFO.hours[lang])}</li>`);
 if(INFO.services[lang].length)L.push(`<li><b>${t.services}</b>${INFO.services[lang].map(esc).join(' · ')}</li>`);
 $('#infoList').innerHTML=L.join('');$('#info').hidden=!L.length;$('#nInfo').hidden=!L.length;
 $('#heroImg').src=IMG.hero;$('#heroImg').alt=HERO_ALT[lang];
 $('#galGrid').innerHTML=GALLERY.map(g=>`<figure><img src="${IMG[g.k]}" alt="${esc(g.alt[lang])}" loading="lazy" decoding="async"></figure>`).join('');
 $('#revList').innerHTML=REVIEWS.map(r=>`<article class="rev"><div class="rh"><span class="av" aria-hidden="true">${r.author?esc(r.author.trim()[0].toUpperCase()):'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>'}</span><div><b>${esc(r.author||t.revBy)}</b><div class="st" role="img" aria-label="${r.stars} / 5">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div></div><span class="src">Google Maps</span></div><p lang="ru">${esc(r.text)}</p></article>`).join('');
 $('#revP').hidden=REVIEWS.length>0;
 const mb=$('#mapBox');
 if(ALLOW_EMBED){if(!$('iframe',mb))mb.innerHTML=`<iframe src="${EMBED}" title="Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`}
 else mb.innerHTML=`<div class="mapcard"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffc400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><p>${esc(t.mapNote)}</p><a class="btn" href="${DIR}" target="_blank" rel="noopener noreferrer">${esc(t.dir)}</a></div>`;
}
const st=$('#status');
function msg(k,c){st.textContent=T[lang][k]||k;st.className=c||''}
$('#cb').addEventListener('submit',async e=>{
 e.preventDefault();const t=T[lang];
 const n=$('#fName').value.trim(),p=$('#fPhone').value.trim();
 if(!n){msg('vName','err');$('#fName').focus();return}
 if(p.replace(/\D/g,'').length<9){msg('vPhone','err');$('#fPhone').focus();return}
 if(!$('#fOk').checked){msg('vOk','err');$('#fOk').focus();return}
 if(!FORM_ENDPOINT){msg('off','err');return}
 msg('sending');
 try{const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:n,phone:p,message:$('#fMsg').value.trim(),language:lang})});
  if(!r.ok)throw 0;msg('sent','ok');e.target.reset()}catch(_){msg('fail','err')}
});
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem("lang",lang)}catch(_){}st.textContent='';render();return}
 if(e.target.closest('nav a'))closeNav();
});
const nav=$('#nav'),bg=$('#burger');
function closeNav(){nav.classList.remove('open');bg.setAttribute('aria-expanded','false')}
bg.addEventListener('click',()=>{const o=nav.classList.toggle('open');bg.setAttribute('aria-expanded',o)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
